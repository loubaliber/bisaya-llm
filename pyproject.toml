[project]
name = "bisaya-llm"
version = "0.1.0"
description = "Open Cebuano (Bisaya) NLP dataset + Unsloth fine-tuning pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "YOUR_NAME_OR_ORG" }]

dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "selectolax>=0.3.21",
  "tenacity>=8.2",
  "pydantic>=2.7",
  "pandas>=2.2",
  "datasets>=2.19",
  "huggingface-hub>=0.23",
  "typer>=0.12",
  "rich>=13.7",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
train = [
  "unsloth",
  "transformers>=4.42",
  "trl>=0.9",
  "peft>=0.11",
  "bitsandbytes>=0.43",
  "accelerate>=0.31",
  "torch>=2.3",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "mypy>=1.10",
  "ruff>=0.4",
  "pre-commit>=3.7",
  "respx>=0.21",
]

[project.scripts]
bisaya = "cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# B008: typer's `= typer.Option(...)` / `= typer.Argument(...)` default-value
# pattern is the documented, idiomatic way to declare CLI options and is a
# false positive for this codebase.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["output/", "tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
